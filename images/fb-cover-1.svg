<svg xmlns="http://www.w3.org/2000/svg" width="820" height="312" viewBox="0 0 820 312">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="690,40 750,70 750,130 690,160 630,130 630,70"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#bg1)"/>

  <!-- Subtle geometric pattern -->
  <g opacity="0.06">
    <rect x="0" y="0" width="820" height="312" fill="none"/>
    <line x1="0" y1="0" x2="820" y2="312" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="820" y2="200" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="820" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="312" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="312" stroke="white" stroke-width="1"/>
    <circle cx="150" cy="80" r="60" fill="none" stroke="white" stroke-width="0.5"/>
    <circle cx="350" cy="250" r="80" fill="none" stroke="white" stroke-width="0.5"/>
    <circle cx="600" cy="100" r="40" fill="none" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Decorative diagonal stripe -->
  <polygon points="580,0 620,0 820,200 820,140" fill="white" opacity="0.05"/>
  <polygon points="640,0 670,0 820,150 820,100" fill="white" opacity="0.04"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="312" fill="url(#accent1)"/>

  <!-- Bottom accent line -->
  <rect x="0" y="304" width="820" height="8" fill="url(#accent1)"/>

  <!-- Concrete roll icon -->
  <g transform="translate(620, 60)" opacity="0.15">
    <ellipse cx="60" cy="90" rx="55" ry="90" fill="none" stroke="white" stroke-width="3"/>
    <ellipse cx="60" cy="90" rx="25" ry="25" fill="none" stroke="white" stroke-width="2"/>
    <line x1="60" y1="0" x2="-40" y2="30" stroke="white" stroke-width="3"/>
    <line x1="-40" y1="30" x2="-40" y2="180" stroke="white" stroke-width="3"/>
    <line x1="-40" y1="180" x2="60" y2="180" stroke="white" stroke-width="3"/>
  </g>

  <!-- Company Name -->
  <text x="50" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="white" letter-spacing="2">
    CONCRETE FABRIC
  </text>

  <!-- Vietnamese name -->
  <text x="50" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" opacity="0.85" letter-spacing="3">
    BÊ TÔNG VẢI CUỘN
  </text>

  <!-- Divider line -->
  <rect x="50" y="152" width="80" height="3" fill="#f59e0b" rx="1.5"/>

  <!-- Tagline -->
  <text x="50" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" opacity="0.9">
    Giải Pháp GCCM Hàng Đầu Việt Nam
  </text>

  <!-- Company full name -->
  <text x="50" y="225" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" opacity="0.6" letter-spacing="1">
    CÔNG TY TNHH VẬN CHUYỂN QUỐC TẾ VIỆT NAM
  </text>

  <!-- Contact info -->
  <g transform="translate(50, 255)">
    <!-- Phone -->
    <g>
      <circle cx="8" cy="8" r="10" fill="white" opacity="0.15"/>
      <text x="8" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">&#9742;</text>
      <text x="25" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" opacity="0.8">0919 335 088</text>
    </g>
    <!-- Email -->
    <g transform="translate(160, 0)">
      <circle cx="8" cy="8" r="10" fill="white" opacity="0.15"/>
      <text x="8" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">&#9993;</text>
      <text x="25" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" opacity="0.8">betongvaicuon@gmail.com</text>
    </g>
    <!-- Website -->
    <g transform="translate(400, 0)">
      <circle cx="8" cy="8" r="10" fill="white" opacity="0.15"/>
      <text x="8" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">&#9737;</text>
      <text x="25" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" opacity="0.8">betongvaicuon.com</text>
    </g>
  </g>

  <!-- Right side decorative elements -->
  <g opacity="0.08">
    <rect x="720" y="20" width="80" height="80" rx="10" fill="none" stroke="white" stroke-width="2" transform="rotate(15, 760, 60)"/>
    <rect x="700" y="180" width="100" height="100" rx="10" fill="none" stroke="white" stroke-width="2" transform="rotate(-10, 750, 230)"/>
  </g>
</svg>